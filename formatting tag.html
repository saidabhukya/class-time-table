<html>
    <head>
        <title>Formatting tag</title>
    </head>
    <body>
        <p>This text is normal</p>
        <h1>my name is <b>BHUKYA SAIDA NAIK</b></h1>
        <b>This text is bold</b>
        <strong>This text is strong</strong></p>
        <i>This text is italic</i>
        <p>This text is<mark> MARKED</mark></p>
        <u>This text is underlined</u><br>
        <del>This text is deleted</del>
        <p>This is <sub>subscripted</sub></p>
        <p>this is <sup>supercripted</sup></p>
    </body>
</html>
